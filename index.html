<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vivienda en España · Panel por CCAA</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0A0E13;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;padding:0}
select{font:inherit;font-size:16px;font-weight:600;background:#0A0E13;color:#E8EEF4;border:1px solid #2A3541;border-radius:10px;padding:8px 12px;min-height:40px}
path[data-sel]{cursor:pointer;transition:opacity .15s}
path[data-sel]:hover{opacity:.85}
path[data-sel]:focus-visible,circle[data-sel]:focus-visible{outline:2px solid #F3F7FA}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #F3F7FA;outline-offset:2px}
h1,h2{margin:0}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:32px 24px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:#121821;border:1px solid #1F2933;border-radius:16px;padding:20px}
.muted{color:#8FA1B3}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 18px;min-height:56px;border-radius:14px;border:1px solid #2A3541;background:#121821;text-align:left}
.tab small{font-size:12px;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(88px,auto);gap:6px}
.tile{border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-height:88px;outline-offset:-3px}
.bar{display:flex;align-items:center;gap:10px;min-height:28px;padding:2px 8px;border-radius:8px;width:100%;text-align:left;background:transparent}
.track{flex:1 1 auto;position:relative;height:12px;background:#1A222C;border-radius:6px}
.fill{position:absolute;top:0;bottom:0;border-radius:6px}
.kpi{flex:1 1 190px;min-width:0;display:flex;flex-direction:column;gap:8px}
.big{font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.def{border-left:3px solid var(--fam);background:#121821;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.5;color:#C5D0DB}
.def b{color:#E8EEF4}
.unitchip{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--fam);color:#0A0E13;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap" id="app" style="--fam:#2DD4BF">

<header style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:6px;min-width:260px">
<span class="muted" style="font-size:13px;letter-spacing:.14em;text-transform:uppercase">INE · CGPJ · Ministerios</span>
<h1 class="disp" style="font-weight:800;font-size:46px;line-height:1.05">Vivienda en España</h1>
<span class="muted" style="font-size:15px">Comunidades autónomas · 2008–2025</span>
</div>
<nav id="tabs" aria-label="Indicador" style="display:flex;flex-wrap:wrap;gap:10px"></nav>
</header>

<div class="def" id="def"></div>
<div id="viewsw" style="display:none;gap:8px;flex-wrap:wrap" role="group" aria-label="Ver en el mapa"></div>

<div id="typesw" style="display:none;gap:8px;flex-wrap:wrap" role="group" aria-label="Tipo de vivienda protegida"></div>
<section id="rangesw" class="card" style="display:none;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px 20px">
<label class="muted" style="font-size:14px">Desde <select id="ya" style="margin-left:8px"></select></label>
<label class="muted" style="font-size:14px">hasta <select id="yb" style="margin-left:8px"></select></label>
<span id="rangeTxt" style="font-size:14px;color:#C5D0DB"></span>
</section>
<section id="yearbar" class="card" style="display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:16px 20px">
<button id="play" style="width:48px;height:48px;border-radius:50%;background:var(--fam);color:#0A0E13;display:flex;align-items:center;justify-content:center;flex:none"></button>
<div id="yearbig" class="disp" style="font-weight:800;font-size:46px;line-height:1;min-width:112px;font-variant-numeric:tabular-nums"></div>
<div style="flex:1 1 320px;display:flex;flex-direction:column;gap:6px">
<input id="range" type="range" min="2008" max="2025" step="1" aria-label="Año" style="width:100%;margin:0;accent-color:var(--fam)">
<div class="muted" style="display:flex;justify-content:space-between;font-size:12px"><span>2008</span><span>2025</span></div>
</div>
</section>

<main class="row">
<section class="card" style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px">
<h2 class="disp" id="mapTitle" style="font-weight:600;font-size:22px"></h2>
<span class="muted" style="font-size:13px">Pulsa un territorio para ver su ficha</span>
</div>
<div id="nodata" style="display:none;background:#2A1520;border:1px solid #5A2A3C;color:#FFD9E0;border-radius:10px;padding:10px 14px;font-size:14px"></div>
<div class="tiles" id="tiles" style="display:none"></div>
<svg id="geomap" viewBox="-20 -5 625 593" role="group" aria-label="Mapa de España por comunidades autónomas" style="width:100%;max-height:660px;display:block"></svg>
<div style="display:flex;flex-direction:column;gap:6px;max-width:440px">
<div id="legbar" style="height:10px;border-radius:5px"></div>
<div id="legend" class="muted" style="display:flex;justify-content:space-between;font-size:12px"></div>
</div>
</section>

<div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px">
<div id="kpis" style="display:flex;flex-wrap:wrap;gap:20px"></div>
<section class="card" style="display:flex;flex-direction:column;gap:12px">
<h2 class="disp" id="rankTitle" style="font-weight:600;font-size:22px"></h2>
<div id="bars" style="display:flex;flex-direction:column;gap:4px"></div>
</section>
</div>
</main>

<section class="card" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px">
<h2 class="disp" id="chartTitle" style="font-weight:600;font-size:22px"></h2>
<div id="chartLeg" style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#C5D0DB"></div>
</div>
<svg id="chart" viewBox="0 0 860 300" role="img" style="width:100%;height:auto;display:block"></svg>
<span id="chartNote" class="muted" style="font-size:13px"></span>
</section>

<footer id="foot" class="muted" style="display:flex;flex-wrap:wrap;gap:12px 32px;padding:4px;font-size:13px"></footer>
</div>

}
