<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vivienda en España · Panel por CCAA</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0A0E13;color:#E8EEF4;font-family:'IBM Plex Sans',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid #F3F7FA;outline-offset:2px}
h1,h2{margin:0}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:32px 24px 48px;display:flex;flex-direction:column;gap:20px}
.card{background:#121821;border:1px solid #1F2933;border-radius:16px;padding:20px}
.muted{color:#8FA1B3}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 18px;min-height:56px;border-radius:14px;border:1px solid #2A3541;background:#121821;text-align:left}
.tab small{font-size:12px;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(88px,auto);gap:6px}
.tile{border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-height:88px;outline-offset:-3px}
.bar{display:flex;align-items:center;gap:10px;min-height:28px;padding:2px 8px;border-radius:8px;width:100%;text-align:left;background:transparent}
.track{flex:1 1 auto;position:relative;height:12px;background:#1A222C;border-radius:6px}
.fill{position:absolute;top:0;bottom:0;border-radius:6px}
.kpi{flex:1 1 190px;min-width:0;display:flex;flex-direction:column;gap:8px}
.big{font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.def{border-left:3px solid var(--fam);background:#121821;border-radius:0 12px 12px 0;padding:12px 16px;font-size:14px;line-height:1.5;color:#C5D0DB}
.def b{color:#E8EEF4}
.unitchip{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--fam);color:#0A0E13;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap" id="app" style="--fam:#2DD4BF">

<header style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:6px;min-width:260px">
<span class="muted" style="font-size:13px;letter-spacing:.14em;text-transform:uppercase">INE · CGPJ · Ministerios</span>
<h1 class="disp" style="font-weight:800;font-size:46px;line-height:1.05">Vivienda en España</h1>
<span class="muted" style="font-size:15px">Comunidades autónomas · 2008–2025</span>
</div>
<nav id="tabs" aria-label="Indicador" style="display:flex;flex-wrap:wrap;gap:10px"></nav>
</header>

<div class="def" id="def"></div>
<div id="viewsw" style="display:none;gap:8px;flex-wrap:wrap" role="group" aria-label="Ver en el mapa"></div>

<section class="card" style="display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:16px 20px">
<button id="play" style="width:48px;height:48px;border-radius:50%;background:var(--fam);color:#0A0E13;display:flex;align-items:center;justify-content:center;flex:none"></button>
<div id="yearbig" class="disp" style="font-weight:800;font-size:46px;line-height:1;min-width:112px;font-variant-numeric:tabular-nums"></div>
<div style="flex:1 1 320px;display:flex;flex-direction:column;gap:6px">
<input id="range" type="range" min="2008" max="2025" step="1" aria-label="Año" style="width:100%;margin:0;accent-color:var(--fam)">
<div class="muted" style="display:flex;justify-content:space-between;font-size:12px"><span>2008</span><span>2025</span></div>
</div>
</section>

<main class="row">
<section class="card" style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px">
<h2 class="disp" id="mapTitle" style="font-weight:600;font-size:22px"></h2>
<span class="muted" style="font-size:13px">Pulsa un territorio para ver su ficha</span>
</div>
<div id="nodata" style="display:none;background:#2A1520;border:1px solid #5A2A3C;color:#FFD9E0;border-radius:10px;padding:10px 14px;font-size:14px"></div>
<div class="tiles" id="tiles"></div>
<div style="display:flex;flex-direction:column;gap:6px;max-width:440px">
<div id="legbar" style="height:10px;border-radius:5px"></div>
<div id="legend" class="muted" style="display:flex;justify-content:space-between;font-size:12px"></div>
</div>
</section>

<div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px">
<div id="kpis" style="display:flex;flex-wrap:wrap;gap:20px"></div>
<section class="card" style="display:flex;flex-direction:column;gap:12px">
<h2 class="disp" id="rankTitle" style="font-weight:600;font-size:22px"></h2>
<div id="bars" style="display:flex;flex-direction:column;gap:4px"></div>
</section>
</div>
</main>

<section class="card" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px">
<h2 class="disp" id="chartTitle" style="font-weight:600;font-size:22px"></h2>
<div id="chartLeg" style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#C5D0DB"></div>
</div>
<svg id="chart" viewBox="0 0 860 300" role="img" style="width:100%;height:auto;display:block"></svg>
<span id="chartNote" class="muted" style="font-size:13px"></span>
</section>

<footer id="foot" class="muted" style="display:flex;flex-wrap:wrap;gap:12px 32px;padding:4px;font-size:13px"></footer>
</div>

  $('viewsw').style.display=isRen(S.ind)?'flex':'none';
  $('viewsw').innerHTML=[['precio','Precio (€/m² al mes)'],['var','Variación anual (%)']].map(([k,l])=>`<button data-view="${k}" aria-pressed="${S.view===k}" style="padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:${S.view===k?c.fam:'#121821'};color:${S.view===k?'#0A0E13':'#E8EEF4'};border:1px solid ${S.view===k?c.fam:'#2A3541'}">${l}</button>`).join('');
  $('play').innerHTML=S.playing?'<svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" fill="currentColor"/><rect x="11" y="2" width="4" height="14" fill="currentColor"/></svg>':'<svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 2 L16 9 L4 16 Z" fill="currentColor"/></svg>';
  $('play').setAttribute('aria-label',S.playing?'Pausar animación':'Reproducir evolución');
  $('yearbig').textContent=S.year;$('range').value=S.year;

  $('mapTitle').innerHTML=esc(c.label)+' · '+S.year+'<span class="unitchip">'+c.unitName+'</span>';
  const nd=S.year<c.from||S.year>(c.to||2025);$('nodata').style.display=nd?'block':'none';
  $('nodata').textContent='Serie disponible de '+c.from+' a '+(c.to||2025)+'. Elige un año dentro de ese rango.';
  $('tiles').style.gridTemplateColumns='repeat('+(isC?5:6)+',minmax(0,1fr))';
  $('tiles').innerHTML=NM.map((n,i)=>{
    const v=vals[i],bg=colorOf(ind,v),p=POS[i],cc=(ind==='lan'&&i>=17);
    const ink=v==null?'#8FA1B3':(lum(bg)>.36?'#0A0E13':'#F3F7FA');
    return `<button class="tile" data-sel="${i}" aria-pressed="${i===sel}" aria-label="${esc(n)}: ${cc?'incluida en Andalucía':fv(v)}" style="grid-column:${p[0]+1} / span ${p[2]};grid-row:${p[1]+1};background:${bg};color:${ink};outline:${i===sel?'3px solid #F3F7FA':'3px solid transparent'}"><span style="font-size:12px;font-weight:600;line-height:1.2">${esc(TN[i])}</span><span class="disp" style="font-weight:700;font-size:21px;font-variant-numeric:tabular-nums">${cc?'—':fv(v)}</span></button>`}).join('');
  $('legbar').style.background=c.grad;
  $('legend').innerHTML=`<span>${c.lo}</span><span>${c.mid}</span><span>${c.hi}</span>`;

  const selSub=selV==null?((ind==='lan'&&sel>=17)?'Incluida en el TSJ de Andalucía':'Sin dato este año'):'';
  const entries=vals.map((v,i)=>({v,i})).filter(e=>e.v!=null).sort((a,b)=>b.v-a.v);
  const rank=entries.findIndex(e=>e.i===sel)+1;
  const kp=[
    {l:isC?'Media 14 ciudades':'Total nacional',v:fv(natV),d:delta(ind,natV,natP,S.year),sp:spark(natS),col:'#E8EEF4',sub:ind==='lan'?'Suma de los 17 TSJ':(isRen(S.ind)?(isC?'Media ponderada de 14 ciudades · ':'Media ponderada de medianas · ')+(S.year>=2011&&S.year<=2024?num(RMN[S.year-2011],0)+' €/mes':'sin dato'):'Serie '+c.cov.split(' · ')[0])},
    {l:NM[sel],v:(ind==='lan'&&sel>=17)?'—':fv(selV),d:delta(ind,selV,selP,S.year),sp:spark(selS),col:c.fam,sub:selSub||('N.º '+rank+' de '+entries.length+(isC?' ciudades':' territorios')+(isRen(S.ind)&&S.year>=2011&&S.year<=2024&&RM[sel][S.year-2011]!=null?' · '+num(RM[sel][S.year-2011],0)+' €/mes':''))}];
  $('kpis').innerHTML=kp.map(k=>`<article class="card kpi" style="padding:18px"><span class="muted" style="font-size:13px">${esc(k.l)}</span><span class="big disp">${k.v}</span><span style="font-size:13px;color:#C5D0DB">${k.d}</span><svg viewBox="0 0 160 44" preserveAspectRatio="none" style="width:100%;height:44px;display:block"><path d="${k.sp}" fill="none" stroke="${k.col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><span class="muted" style="font-size:12px">${k.sub}</span></article>`).join('');

  $('rankTitle').textContent='Ranking · '+S.year+' ('+c.unitName+')';
  const zero=Math.max(0,(0-c.d0)/(c.d1-c.d0));
  $('bars').innerHTML=entries.map(e=>{
    const pos=Math.max(0,Math.min(1,(e.v-c.d0)/(c.d1-c.d0)));
    return `<button class="bar" data-sel="${e.i}" aria-label="${esc(NM[e.i])}: ${fv(e.v)}" style="background:${e.i===sel?'#1E2833':'transparent'}"><span style="flex:0 0 118px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(NM[e.i])}</span><span class="track"><span class="fill" style="left:${(Math.min(zero,pos)*100).toFixed(1)}%;width:${(Math.abs(pos-zero)*100).toFixed(1)}%;background:${colorOf(ind,e.v)}"></span></span><span style="flex:0 0 74px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums">${fv(e.v)}</span></button>`}).join('');

  // chart
  const W=860,H=300,pl=48,pr=16,pt=28,pb=30,xOf=y=>pl+(y-2008)/17*(W-pl-pr);
  const natPlot=ind==='lan'?natS.map(v=>v==null?null:v/17):natS;
  const all=natPlot.concat(selS).filter(v=>v!=null);
  let mn=Math.min(...all),mx=Math.max(...all);
  if(ind==='lan')mn=0;else if(ind==='ipv'||ind==='renv')mn=Math.min(mn,0);else mn=Math.max(0,Math.floor(mn-2));
  mx=mx+(mx-mn)*.08;
  const yOf=v=>pt+(1-(v-mn)/((mx-mn)||1))*(H-pt-pb);
  const pathOf=a=>{let d='',pen=false;a.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+xOf(2008+i).toFixed(1)+' '+yOf(v).toFixed(1)+' ';pen=true});return d};
  let g='';
  g+=`<rect x="${xOf(2008)}" y="28" width="${xOf(2013)-xOf(2008)}" height="242" fill="rgba(143,161,179,.09)"/>`;
  for(let k=0;k<5;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="48" x2="844" y1="${yOf(v).toFixed(1)}" y2="${yOf(v).toFixed(1)}" stroke="#1F2933"/><text x="40" y="${(yOf(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#8FA1B3">${num(v,0)}</text>`}
  for(let y=2008;y<=2025;y+=2)g+=`<text x="${xOf(y).toFixed(1)}" y="292" text-anchor="middle" font-size="11" fill="#8FA1B3">${y}</text>`;
  g+=`<text x="${xOf(2008)+4}" y="20" font-size="11" fill="#C5D0DB">Crisis 2008–2013</text>`;
  [[2020,'Covid-19'],[2023,'Ley de vivienda']].forEach(([y,l])=>{g+=`<line x1="${xOf(y)}" x2="${xOf(y)}" y1="28" y2="270" stroke="#8FA1B3" stroke-dasharray="3 4"/><text x="${xOf(y)}" y="20" text-anchor="middle" font-size="11" fill="#C5D0DB">${l}</text>`});
  g+=`<line x1="${xOf(S.year)}" x2="${xOf(S.year)}" y1="28" y2="270" stroke="${c.fam}" stroke-opacity=".55" stroke-width="1.5"/>`;
  g+=`<path d="${pathOf(natPlot)}" fill="none" stroke="#8FA1B3" stroke-width="2" stroke-dasharray="5 4"/><path d="${pathOf(selS)}" fill="none" stroke="${c.fam}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(natPlot[yi]!=null)g+=`<circle cx="${xOf(S.year)}" cy="${yOf(natPlot[yi])}" r="5" fill="#8FA1B3" stroke="#121821" stroke-width="2"/>`;
  if(selS[yi]!=null)g+=`<circle cx="${xOf(S.year)}" cy="${yOf(selS[yi])}" r="5" fill="${c.fam}" stroke="#121821" stroke-width="2"/>`;
  $('chart').innerHTML=g;$('chart').setAttribute('aria-label','Evolución 2008–2025 de '+NM[sel]);
  const natName=ind==='lan'?'Media por CCAA':(isC?'Media 14 ciudades (ponderada)':(S.ind==='ren'?'Media ponderada nacional':'Total nacional'));
  $('chartTitle').textContent='Evolución · '+NM[sel]+' ('+c.unitName+')';
  $('chartLeg').innerHTML=`<span style="display:flex;align-items:center;gap:8px"><span style="width:22px;border-top:2px dashed #8FA1B3"></span>${natName}</span><span style="display:flex;align-items:center;gap:8px"><span style="width:22px;height:3px;border-radius:2px;background:${c.fam}"></span>${esc(NM[sel])}</span>`;
  $('chartNote').textContent=ind==='lan'?'Sin datos del CGPJ antes de 2013.'+(sel>=17?' Ceuta y Melilla se cuentan dentro de Andalucía.':''):(ind==='ipv'?'Variación anual del índice de medias anuales; 2008 sin dato.':(isRen(S.ind)?'Serie SERPAVI 2011–2024; la variación empieza en 2012.'+(isC?' Bilbao solo tiene dato en 2024.':''):'Porcentaje de hogares en alquiler a precio de mercado.'));
  $('foot').innerHTML=`<span><b style="color:#C5D0DB;font-weight:600">Fuente:</b> ${c.src}</span><span><b style="color:#C5D0DB;font-weight:600">Cobertura:</b> ${c.cov}</span><span><b style="color:#C5D0DB;font-weight:600">Aviso:</b> ${c.warn}</span><span><b style="color:#C5D0DB;font-weight:600">Descarga:</b> 11–12 oct 2026</span>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-ind]');if(t){S.ind=t.dataset.ind;render();return}
  const vw=e.target.closest('[data-view]');if(vw){S.view=vw.dataset.view;render();return}
  const s=e.target.closest('[data-sel]');if(s){if(S.ind==='ciu')S.selC=+s.dataset.sel;else S.sel=+s.dataset.sel;render();return}
  if(e.target.closest('#play'))togglePlay();
});
$('range').addEventListener('input',e=>{S.year=+e.target.value;render()});
render();
</script>
</body>
</html>
